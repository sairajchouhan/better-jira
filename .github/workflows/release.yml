name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: better-jira-darwin-arm64
            target: bun-darwin-arm64
          - asset: better-jira-darwin-x64
            target: bun-darwin-x64
          - asset: better-jira-linux-x64
            target: bun-linux-x64
          - asset: better-jira-linux-arm64
            target: bun-linux-arm64
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Compile standalone binary
        run: bun scripts/build-binary.ts --target "${{ matrix.target }}" --out "dist/release/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: dist/release/${{ matrix.asset }}

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: |
          chmod +x better-jira-*
          sha256sum better-jira-* > checksums.txt
          cat checksums.txt
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "better-jira $TAG" \
              --generate-notes
          fi
