# Bun never loads a .env on its own here: each instance's .env is passed by scripts/instance.ts, and a stray root .env must not leak in.
env = false

[serve.static]
plugins = ["bun-plugin-tailwind"]
env = "BUN_PUBLIC_*"

[lint]
# typeAware = true   # also run the rules that need types

[lint.rules]
# "no-console" = "warn"
# "eqeqeq" = ["error", "smart"]

[fmt]
printWidth = 100 # oxfmt's default, which formatted this repo
ignorePatterns = [".raj/", "dist/", ".agents/", ".claude/"]
